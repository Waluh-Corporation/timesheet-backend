host: localhost:8080
info:
  contact:
    name: API Support
  description: |-
    High-performance RESTful backend API for the Timesheet Automation Portal, built with Go (Gin Engine) and PostgreSQL.
    - Automated Timesheet Generator: Multi-company Excel (.xlsx) and PDF generation (MII, SDD, Adidata, NTT) with day-fraction calculations, dynamic day trimming, formula preservation, and async SMTP delivery.
    - Dynamic Template Engine: Dedicated programmatic template builders alongside visual cell-mapping coordinate parsers integrated with Handsontable.
    - Dual Authentication & Security: JWT sessions with NIST SP 800-63B compliant Argon2id password hashing and WebAuthn FIDO2 Passkeys (biometric & hardware-bound).
    - Role-Based Access Control (RBAC): Admin and User role segregation, centralized account administration, and profile change approval workflows.
    - Web Push Notifications: Daily reminder scheduler pinned to 17:00 WIB (Asia/Jakarta) notifying active users via VAPID.
    - 3NF Relational Master Data: Normalized PostgreSQL database schema (Companies, Departments, Projects, Holidays, Activity Statuses) with foreign keys and automated SQL migrations.
    - API Versioning: Standardized RESTful endpoints routed under the `/api/v1/*` namespace.
  license:
    name: MIT
  termsOfService: https://github.com/naufalzaid17/timesheet-generator
  title: Timesheet Automation Portal API
  version: "2.0"
paths:
  /.well-known/webauthn:
    get:
      description: Serves the WebAuthn Related Origin Requests well-known document
        for multi-domain passkeys.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OriginsResponse'
      summary: WebAuthn related origins document
      tags:
      - Passkey
  /api/v1/activities:
    get:
      description: Retrieves all daily activities for the authenticated user for a
        specific month and year.
      parameters:
      - description: Year (defaults to current year)
        in: query
        name: year
        type: integer
      - description: Month 1-12 (defaults to current month)
        in: query
        name: month
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.DailyActivity'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List monthly activities
      tags:
      - Activity
    post:
      consumes:
      - application/json
      description: Creates or updates a daily activity record for the authenticated
        user on a given date.
      parameters:
      - description: Daily activity payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.DailyActivityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DailyActivity'
        "400":
          description: Invalid date format or payload
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upsert daily timesheet activity
      tags:
      - Activity
  /api/v1/activity-statuses:
    get:
      description: Returns all normalized activity status options (e.g. Present, Sick,
        Vacation).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ActivityStatus'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List activity status options
      tags:
      - Master Data
  /api/v1/admin/profile-changes:
    get:
      description: Retrieves submitted profile change requests with optional status
        filtering (admin only).
      parameters:
      - description: Filter by review status (pending, approved, rejected)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ProfileChangeRequest'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Admin only
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all profile change requests (Admin)
      tags:
      - Admin
  /api/v1/admin/profile-changes/{id}/review:
    post:
      description: Approves or rejects a submitted profile change request (admin only).
      parameters:
      - description: Request ID
        in: path
        name: id
        required: true
        type: integer
      - description: Review action
        enum:
        - approve
        - reject
        in: query
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ProfileChangeRequest'
        "400":
          description: Invalid action
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Admin only
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Request not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Request already reviewed
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Review profile change request (Admin)
      tags:
      - Admin
  /api/v1/admin/templates:
    post:
      consumes:
      - multipart/form-data
      description: Ingests an admin-uploaded .xlsx workbook template for timesheet
        generation.
      parameters:
      - description: Excel .xlsx template file
        in: formData
        name: file
        required: true
        type: file
      - description: Template display name
        in: formData
        name: name
        type: string
      - description: Template description
        in: formData
        name: description
        type: string
      - description: Associated company code or name
        in: formData
        name: company
        type: string
      - description: Target worksheet name
        in: formData
        name: sheet_name
        type: string
      - description: Set as default template (true/false)
        in: formData
        name: is_default
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Template'
        "400":
          description: Invalid file or parameters
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Admin only
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload template workbook (Admin)
      tags:
      - Admin
  /api/v1/admin/templates/{id}:
    delete:
      description: Removes a template and its mappings (admin only).
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
