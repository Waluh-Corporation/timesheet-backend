      - Push Notification
  /api/v1/push/test:
    post:
      description: Dispatches an immediate test push notification to verify browser
        notification display.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Send test push notification
      tags:
      - Push Notification
  /api/v1/push/unsubscribe:
    post:
      consumes:
      - application/json
      description: Removes active push subscription for the browser, silencing timesheet
        reminder notifications.
      parameters:
      - description: Optional endpoint filter
        in: body
        name: request
        schema:
          $ref: '#/definitions/models.UnsubscribeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Unsubscribe from Web Push notifications
      tags:
      - Push Notification
  /api/v1/push/vapid-public-key:
    get:
      description: Returns the application server public key for browser Web Push
        subscription.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VAPIDKeyResponse'
      summary: Get VAPID public key
      tags:
      - Push Notification
  /api/v1/templates:
    get:
      description: Retrieves all uploaded timesheet templates with their cell mappings.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Template'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List templates
      tags:
      - Template
  /api/v1/templates/{id}/grid:
    get:
      description: Returns the parsed 2-D cell grid and merged cells for Handsontable
        rendering.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.SheetLayout'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Template not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get template grid layout
      tags:
      - Template
  /api/v1/timesheet/generate:
    post:
      consumes:
      - application/json
      description: Renders monthly activities and overtimes into an Excel (.xlsx)
        workbook, initiates download, and dispatches an email copy.
      parameters:
      - description: Generation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GenerateRequest'
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Generated Excel workbook (.xlsx)
          schema:
            type: file
        "400":
          description: Template or company mapping missing
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Generation failed
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate timesheet spreadsheet
      tags:
      - Timesheet
securityDefinitions:
  BearerAuth:
    description: Enter JWT token with format "Bearer {token}".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
