name: Semantic Pull Request Title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - development

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-pr-title:
    name: Validate Conventional Commit Title
    runs-on: ubuntu-latest
    if: >-
      !startsWith(github.head_ref, 'release') &&
      !startsWith(github.head_ref, 'chore/release') &&
      !startsWith(github.event.pull_request.title, 'Release') &&
      !startsWith(github.event.pull_request.title, 'release') &&
      !contains(github.event.pull_request.labels.*.name, 'release')
    steps:
      - name: Validate PR Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: "Subject must not start with an uppercase letter to follow Conventional Commits."
