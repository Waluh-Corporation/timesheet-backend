name: Sync Main to Development

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-main-to-development
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync Main into Development
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main into development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main

          # 1. Check if origin/main is already an ancestor of development
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "development is already up to date with main (ancestor check). Nothing to do."
            exit 0
          fi

          # 2. Check if code tree is already identical (e.g. main was merged from development)
          if git diff --quiet origin/main HEAD; then
            echo "Code tree in development is already identical to main. Nothing to do."
            exit 0
          fi

          echo "Code differences detected between main and development. Creating sync branch..."
          SYNC_BRANCH="sync/main-to-development-${{ github.run_id }}"
          git checkout -b "$SYNC_BRANCH"

          if ! git merge --no-edit origin/main -m "chore: sync main into development"; then
            echo "::error::Merge conflict encountered when syncing main into development. Manual resolution required."
            git merge --abort || true
            exit 1
          fi

          git push origin "$SYNC_BRANCH"

          echo "Opening Pull Request to sync changes into development..."
          gh pr create \
            --base development \
            --head "$SYNC_BRANCH" \
            --title "chore: sync main into development" \
            --body "Automated Pull Request to sync changes from \`main\` into \`development\` following repository branch protection rules."
