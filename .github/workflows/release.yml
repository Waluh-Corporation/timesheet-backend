name: Release & Changelog

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag version to release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release & Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Tag Name
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ### 📦 Container Images
            Production image has been published to GitHub Container Registry:
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.release_tag.outputs.tag }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```
