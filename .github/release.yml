changelog:
  exclude:
    labels:
      - "ignore-for-release"
      - "chore"
      - "dependencies"
      - "test"
      - "ci"
    authors:
      - "dependabot[bot]"
      - "github-actions[bot]"
  categories:
    - title: "New Features"
      labels:
        - "feature"
        - "feat"
        - "enhancement"
    - title: "Improvements"
      labels:
        - "improvement"
        - "perf"
        - "performance"
    - title: "Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "Breaking Changes"
      labels:
        - "breaking-change"
        - "breaking"
    - title: "Security"
      labels:
        - "security"
