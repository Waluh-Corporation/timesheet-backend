sonar.projectKey=Waluh-Corporation_timesheet-generator
sonar.organization=waluh-corporation
sonar.projectName=timesheet-backend

# Source code and exclusions
sonar.sources=.
sonar.exclusions=**/*_test.go,docs/**,assets/**,scripts/**,tmp/**,templates/**,mailer/template/*.html,database/schema_dump.sql
sonar.test.exclusions=**/*_test.go
sonar.cpd.exclusions=mailer/template/**

# Go test coverage report path from CI
sonar.go.coverage.reportPaths=coverage.out
sonar.coverage.exclusions=main.go,docs/**,database/database.go,docs/architecture.html,postman_collection.json

# Disable PL/SQL analyzer from analyzing PostgreSQL files as Oracle PL/SQL
sonar.plsql.file.suffixes=-

# Source encoding
sonar.sourceEncoding=UTF-8
