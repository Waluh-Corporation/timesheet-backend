version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - copyloopvar
    - durationcheck
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unparam
    - unused
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gosec:
      excludes:
        - G104 # unchecked error, handled by errcheck
        - G304 # file path inclusion
    misspell:
      locale: US
  exclusions:
    paths:
      - docs
      - assets
      - scripts
      - tmp
      - static
      - scratch
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - unparam
