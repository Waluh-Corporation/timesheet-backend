  /api/v1/setup/init:
    post:
      consumes:
      - application/json
      description: One-time setup endpoint to create the primary Super Administrator,
        initial companies, approvers, and departments. Automatically seeds ActivityStatus
        and sets is_new = N. Fails with 403 if system is already initialized.
      parameters:
      - description: Initialization payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.InitSetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Setup success response with admin token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: System already initialized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Perform initial system onboarding setup
      tags:
      - Setup
  /api/v1/setup/status:
    get:
      description: Returns whether the system is already configured with an administrator
        or requires initial onboarding setup.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SetupStatusResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Check system onboarding initialization status
      tags:
      - Setup
  /api/v1/timesheet/generate:
    post:
      consumes:
      - application/json
      description: Renders monthly activities and overtimes into an Excel (.xlsx)
        workbook, initiates download, and dispatches an email copy.
      parameters:
      - description: Generation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GenerateRequest'
      produces:
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        "200":
          description: Generated Excel workbook (.xlsx)
          schema:
            type: file
        "400":
          description: Template or company mapping missing
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Generation failed
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate timesheet spreadsheet
      tags:
      - Timesheet
securityDefinitions:
  BearerAuth:
    description: Enter JWT token with format "Bearer {token}".
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
