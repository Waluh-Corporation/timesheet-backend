version: "3.8"

# ==============================================================================
# Timesheet Generator - Unified Docker Compose Stack
#
# Memulai stack (Build lokal):
#   docker compose up --build -d
#
# Memulai stack (Menggunakan image GHCR):
#   docker compose pull && docker compose up -d
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Database (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: timesheet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timesheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timesheet}
      POSTGRES_DB: ${POSTGRES_DB:-timesheet}
      TZ: ${SCHEDULER_TZ:-Asia/Jakarta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timesheet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - timesheet-net

  # ----------------------------------------------------------------------------
  # 2. Backend Service (Go REST API)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${BACKEND_IMAGE:-ghcr.io/naufalzaid17/timesheet-generator-backend:latest}
    container_name: timesheet_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      DATABASE_URL: ${DATABASE_URL:-host=postgres user=timesheet password=timesheet dbname=timesheet port=5432 sslmode=disable TimeZone=Asia/Jakarta}
      JWT_SECRET: ${JWT_SECRET:-supersecret-random-jwt-key-change-this-in-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      RESET_TOKEN_TTL_MINUTES: ${RESET_TOKEN_TTL_MINUTES:-60}
      SCHEDULER_TZ: ${SCHEDULER_TZ:-Asia/Jakarta}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Timesheet Portal <no-reply@timesheet.local>}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_RP_ORIGIN: ${WEBAUTHN_RP_ORIGIN:-http://localhost:3000}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Timesheet Portal}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@timesheet.local}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@timesheet.local}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - timesheet-net

  # ----------------------------------------------------------------------------
  # 3. Frontend Service (Next.js SPA / Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    image: ${FRONTEND_IMAGE:-ghcr.io/naufalzaid17/timesheet-generator-frontend:latest}
    container_name: timesheet_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - timesheet-net

  # ----------------------------------------------------------------------------
  # 4. Mailpit (Local SMTP Server & Web Inbox UI)
  # ----------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: timesheet_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - timesheet-net

volumes:
  postgres_data:
    driver: local

networks:
  timesheet-net:
    driver: bridge
