services:
  # ============================================================================
  # Go Backend API Service
  # ============================================================================
  backend:
    image: ghcr.io/waluh-corporation/timesheet-backend:latest
    container_name: timesheet_backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "${GIN_MODE:-debug}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-timesheet} password=${POSTGRES_PASSWORD:-timesheet} dbname=${POSTGRES_DB:-timesheet} port=5432 sslmode=disable TimeZone=Asia/Jakarta"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      RESET_TOKEN_TTL_MINUTES: "${RESET_TOKEN_TTL_MINUTES:-60}"
      SCHEDULER_TZ: "Asia/Jakarta"
      # SMTP Configuration (External SMTP Server)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-Timesheet Portal <no-reply@example.com>}"
      # WebAuthn / Passkey relying party
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_RP_ORIGIN: "${WEBAUTHN_RP_ORIGIN:-http://localhost:8080,http://localhost:3000}"
      WEBAUTHN_RP_NAME: "Timesheet Portal"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      # VAPID keys for Web Push (leave blank to auto-generate at boot)
      # Generate VAPID keys using: https://vapidkeys.com
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@example.com}"
      # Bootstrap Administrator
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timesheet-net

  # ============================================================================
  # Primary Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: timesheet_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-timesheet}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-timesheet}"
      POSTGRES_DB: "${POSTGRES_DB:-timesheet}"
      TZ: Asia/Jakarta
    ports:
      - "5432:5432" # Direct access for DBeaver / psql / Navicat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timesheet} -d ${POSTGRES_DB:-timesheet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - timesheet-net

volumes:
  postgres_data:

networks:
  timesheet-net:
    driver: bridge
