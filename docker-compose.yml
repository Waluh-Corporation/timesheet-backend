services:
  # ============================================================================
  # Go Backend API Service
  # ============================================================================
  backend:
    build: .
    image: ghcr.io/waluh-corporation/timesheet-backend:latest
    container_name: timesheet_backend
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GIN_MODE: "${GIN_MODE:-debug}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-timesheet} password=${POSTGRES_PASSWORD:-timesheet} dbname=${POSTGRES_DB:-timesheet} port=5432 sslmode=disable TimeZone=Asia/Jakarta"
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_EXPIRY_HOURS: "${JWT_EXPIRY_HOURS:-24}"
      RESET_TOKEN_TTL_MINUTES: "${RESET_TOKEN_TTL_MINUTES:-60}"
      SCHEDULER_TZ: "Asia/Jakarta"
      SCHEDULER_REMINDER_CRON: "${SCHEDULER_REMINDER_CRON:-0 17 * * *}"
      SCHEDULER_CLEANUP_CRON: "${SCHEDULER_CLEANUP_CRON:-0 2 * * *}"
      # SMTP Configuration (External SMTP Server)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-Timesheet Portal <no-reply@example.com>}"
      # WebAuthn / Passkey relying party
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_RP_ORIGIN: "${WEBAUTHN_RP_ORIGIN:-http://localhost:8080,http://localhost:3000}"
      WEBAUTHN_RP_NAME: "Timesheet Portal"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8080}"
      # VAPID keys for Web Push (leave blank to auto-generate at boot)
      # Generate VAPID keys using: https://vapidkeys.com
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-mailto:admin@example.com}"
      # Bootstrap Administrator
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      # Redis Task Queue
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      # S3-Compatible Object Storage
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-timesheets}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-false}"
      S3_RETENTION_DAYS: "${S3_RETENTION_DAYS:-7}"
      # Mailer & Generation Limits
      MAILER_RATE_LIMIT: "${MAILER_RATE_LIMIT:-10.0}"
      MAILER_WORKER_COUNT: "${MAILER_WORKER_COUNT:-5}"
      EXCEL_MAX_CONCURRENT_JOBS: "${EXCEL_MAX_CONCURRENT_JOBS:-10}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - timesheet-net

  # ============================================================================
  # Task Queue Broker: Redis 7
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: timesheet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - timesheet-net

  # ============================================================================
  # Primary Database: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: timesheet_postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-timesheet}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-timesheet}"
      POSTGRES_DB: "${POSTGRES_DB:-timesheet}"
      TZ: Asia/Jakarta
    ports:
      - "5432:5432" # Direct access for DBeaver / psql / Navicat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-timesheet} -d ${POSTGRES_DB:-timesheet}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - timesheet-net

volumes:
  postgres_data:
  redis_data:

networks:
  timesheet-net:
    driver: bridge
